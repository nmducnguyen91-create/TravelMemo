# Builds the web app and publishes it to Firebase Hosting (https://<project>.web.app) on every push to main,
# or manually from the Actions tab. Keyless: GitHub's OIDC token is exchanged through Workload Identity
# Federation for a service account that can only manage Hosting (see docs/decisions/ADR-003.md).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Identifiers only, not credentials. The app reads its Firebase web config at runtime from
      # /__/firebase/init.json on Firebase Hosting, so no API key is stored in the repository or CI.
      FIREBASE_PROJECT_ID: travelmemo-ce0d6
      GCP_WIF_PROVIDER: projects/1091313995838/locations/global/workloadIdentityPools/github/providers/github-oidc
      GCP_DEPLOY_SERVICE_ACCOUNT: github-deployer@travelmemo-ce0d6.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform web
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
